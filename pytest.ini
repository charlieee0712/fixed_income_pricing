[pytest]
# ASCII only, on purpose: pytest reads this file with the system codec (GBK on the
# Windows dev machine), so a stray em dash or curly quote aborts every run.
#
# Collect only the real suite. Without `testpaths`, a bare `pytest` from the repo root
# also walks the git-ignored Google-Drive staging copies (`corporate_bond/`,
# `code_structure_sample/`), which hold duplicates of these very test files; pytest
# then refuses the whole run with "import file mismatch ... use a unique basename".
# That bites on any machine where a staging copy exists (it does locally, not on 47).
testpaths = tests
norecursedirs = corporate_bond code_structure_sample .venv venv env outputs extracted docs data .git __pycache__
